services:
  - type: web
    name: sdi-survey
    env: node
    # Build React frontend first, then install server deps
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ZOHO_OWNER
        value: straydoginstitute
      - key: ZOHO_APP
        value: stray-dog-institute
      - key: ZOHO_DOMAIN
        value: zoho.com
      - key: ZOHO_SURVEY_FORM
        value: State_of_the_Movement_Survey
      - key: ZOHO_SURVEY_REPORT
        value: State_of_the_Movement_Survey_Report
      - key: ZOHO_GRANT_CYCLE_REPORT
        value: Grant_Cycles
      - key: ZOHO_EMAIL_FIELD
        value: What_is_your_work_email_address
      - key: ZOHO_YEAR_FIELD
        value: Current_Year
      - key: ZOHO_CYCLE_FIELD
        value: Grant_Cycle
      # Secrets — add manually in Render dashboard, never commit:
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
